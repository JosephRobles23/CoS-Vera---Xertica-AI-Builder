<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ---- shadcn / Neutral (design tokens, OKLCH) ---- */
    :root {
      --background: oklch(1 0 0); --foreground: oklch(0.145 0 0);
      --card: oklch(1 0 0); --card-foreground: oklch(0.145 0 0);
      --popover: oklch(1 0 0); --popover-foreground: oklch(0.145 0 0);
      --primary: oklch(0.205 0 0); --primary-foreground: oklch(0.985 0 0);
      --secondary: oklch(0.97 0 0); --secondary-foreground: oklch(0.205 0 0);
      --muted: oklch(0.97 0 0); --muted-foreground: oklch(0.556 0 0);
      --accent: oklch(0.97 0 0); --accent-foreground: oklch(0.205 0 0);
      --destructive: oklch(0.577 0.245 27.325);
      --border: oklch(0.922 0 0); --input: oklch(0.922 0 0); --ring: oklch(0.708 0 0);
      --scroll: oklch(0.45 0 0 / 0.28); --scroll-hover: oklch(0.45 0 0 / 0.45);
      --radius: 0.625rem; --radius-sm: calc(var(--radius) - 4px);
      --shadow: 0 1px 2px 0 oklch(0 0 0 / 0.05); --shadow-md: 0 4px 16px -4px oklch(0 0 0 / 0.18);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: oklch(0.145 0 0); --foreground: oklch(0.985 0 0);
        --card: oklch(0.205 0 0); --card-foreground: oklch(0.985 0 0);
        --popover: oklch(0.205 0 0); --popover-foreground: oklch(0.985 0 0);
        --primary: oklch(0.922 0 0); --primary-foreground: oklch(0.205 0 0);
        --secondary: oklch(0.269 0 0); --secondary-foreground: oklch(0.985 0 0);
        --muted: oklch(0.269 0 0); --muted-foreground: oklch(0.708 0 0);
        --accent: oklch(0.269 0 0); --accent-foreground: oklch(0.985 0 0);
        --destructive: oklch(0.704 0.191 22.216);
        --border: oklch(1 0 0 / 0.1); --input: oklch(1 0 0 / 0.15); --ring: oklch(0.556 0 0);
        --scroll: oklch(1 0 0 / 0.2); --scroll-hover: oklch(1 0 0 / 0.35);
      }
    }
    * { box-sizing: border-box; margin: 0; scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--scroll-hover); }

    html, body { background: var(--background); }
    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif; color: var(--foreground);
      font-size: 13px; line-height: 1.5; padding: 14px; -webkit-font-smoothing: antialiased;
    }
    [data-lucide] { display: inline-flex; align-items: center; justify-content: center; line-height: 0; }
    svg { width: 16px; height: 16px; }

    .app-header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .app-header .logo {
      width: 28px; height: 28px; border-radius: var(--radius-sm); background: var(--primary);
      color: var(--primary-foreground); display: grid; place-items: center; flex: 0 0 auto;
    }
    .app-header .logo svg { width: 15px; height: 15px; }
    .app-header h1 { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
    .app-header p { font-size: 11px; color: var(--muted-foreground); }

    nav { display: flex; gap: 2px; background: var(--muted); padding: 3px; border-radius: var(--radius); margin-bottom: 14px; }
    nav button {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0;
      background: transparent; cursor: pointer; padding: 7px 2px; border-radius: var(--radius-sm);
      color: var(--muted-foreground); font: inherit; font-size: 10.5px; font-weight: 500; transition: background .15s, color .15s;
    }
    nav button:hover { color: var(--foreground); }
    nav button.active { background: var(--background); color: var(--foreground); box-shadow: var(--shadow); }
    nav button svg { width: 15px; height: 15px; }

    .panel { display: none; animation: fade .18s ease; }
    .panel.active { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; } }

    h3 { font-size: 12px; font-weight: 600; margin: 14px 0 8px; letter-spacing: -0.01em; }
    label { display: block; font-size: 11px; font-weight: 500; color: var(--muted-foreground); margin: 10px 0 4px; }

    input, select, textarea {
      width: 100%; padding: 7px 9px; font: inherit; font-size: 12.5px; color: var(--foreground);
      background: var(--background); border: 1px solid var(--input); border-radius: var(--radius-sm);
      transition: border-color .15s, box-shadow .15s; outline: none;
    }
    input::placeholder, textarea::placeholder { color: var(--muted-foreground); opacity: .65; }
    input:focus, select:focus, textarea:focus { border-color: var(--ring); box-shadow: 0 0 0 3px oklch(0.708 0 0 / 0.25); }
    select option, select optgroup { background: var(--popover); color: var(--popover-foreground); }
    textarea { min-height: 76px; resize: vertical; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0;
      border-radius: var(--radius-sm); cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 500;
      padding: 8px 12px; transition: opacity .15s, background .15s; width: 100%; margin-top: 10px;
    }
    .btn svg { width: 14px; height: 14px; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: var(--primary-foreground); }
    .btn-primary:hover:not(:disabled) { opacity: .9; }
    .btn-outline { background: var(--background); color: var(--foreground); border: 1px solid var(--border); }
    .btn-outline:hover:not(:disabled) { background: var(--accent); }
    .btn-ghost { background: transparent; color: var(--muted-foreground); width: auto; margin-top: 8px; padding: 6px 8px; }
    .btn-ghost:hover:not(:disabled) { background: var(--accent); color: var(--accent-foreground); }

    .card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); padding: 10px; margin: 8px 0; }
    .row { display: flex; gap: 6px; align-items: center; }
    .row > * { flex: 1; }
    .row .icon-btn { flex: 0 0 auto; }
    .card input, .card select { margin-top: 6px; }
    .card .row input, .card .row select { margin-top: 0; }

    .icon-btn {
      display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid var(--border);
      background: var(--background); border-radius: var(--radius-sm); cursor: pointer; color: var(--muted-foreground);
      transition: background .15s, color .15s, border-color .15s;
    }
    .icon-btn:hover { background: var(--destructive); color: #fff; border-color: var(--destructive); }
    .icon-btn svg { width: 14px; height: 14px; }

    /* ---- Time picker (popover custom) ---- */
    .tp { position: relative; }
    .tp-trigger {
      width: 100%; display: flex; align-items: center; gap: 6px; padding: 7px 9px;
      border: 1px solid var(--input); border-radius: var(--radius-sm); background: var(--background);
      color: var(--foreground); font: inherit; font-size: 12.5px; cursor: pointer; transition: background .15s, border-color .15s;
    }
    .tp-trigger:hover { background: var(--accent); }
    .tp-trigger .tp-val { flex: 1; text-align: left; }
    .tp-trigger .tp-clock { color: var(--muted-foreground); }
    .tp-trigger .tp-caret { color: var(--muted-foreground); }
    .tp-trigger svg { width: 14px; height: 14px; }
    .tp-pop {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 40; display: none; gap: 6px;
      padding: 6px; background: var(--popover); color: var(--popover-foreground);
      border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-md);
    }
    .tp-pop.open { display: flex; }
    .tp-col { flex: 1; max-height: 168px; overflow-y: auto; }
    .tp-item { padding: 6px 8px; border-radius: 6px; font-size: 12.5px; text-align: center; cursor: pointer; color: var(--popover-foreground); }
    .tp-item:hover { background: var(--accent); color: var(--accent-foreground); }
    .tp-item.sel { background: var(--primary); color: var(--primary-foreground); }

    .hint { font-size: 11px; color: var(--muted-foreground); margin-top: 8px; }
    .hint a { color: var(--foreground); font-weight: 500; word-break: break-all; }
    .divider { height: 1px; background: var(--border); margin: 14px 0; }

    #toast {
      position: fixed; left: 14px; right: 14px; bottom: 14px; background: var(--popover); color: var(--popover-foreground);
      border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-md);
      padding: 10px 12px; font-size: 12px; display: none; align-items: center; gap: 8px; z-index: 60;
    }
    #toast svg { width: 15px; height: 15px; flex: 0 0 auto; color: var(--muted-foreground); }

  </style>
</head>
<body>
  <div class="app-header">
    <div class="logo"><i data-lucide="briefcase"></i></div>
    <div><h1>Chief of Staff</h1><p>Configuración CLEVEL-REPORTS</p></div>
  </div>

  <nav>
    <button data-tab="prompts" class="active"><i data-lucide="sparkles"></i>Prompts</button>
    <button data-tab="horarios"><i data-lucide="clock"></i>Horarios</button>
    <button data-tab="equipo"><i data-lucide="users"></i>Equipo</button>
  </nav>

  <!-- PROMPTS -->
  <div id="prompts" class="panel active">
    <p class="hint">El placeholder muestra el prompt por defecto. Vacío = usa ese default.</p>
    <label>soul.md — voz del asistente</label><textarea id="p_soul"></textarea>
    <label>user.md — contexto del líder / equipo</label><textarea id="p_user"></textarea>
    <label>Resumen Daily (por fila)</label><textarea id="p_sd"></textarea>
    <label>Resumen Weekly (por fila)</label><textarea id="p_sw"></textarea>
    <label>Consolidado Diario</label><textarea id="p_cd"></textarea>
    <label>Consolidado Semanal</label><textarea id="p_cw"></textarea>
    <button class="btn btn-outline" onclick="reestablecerPrompts()"><i data-lucide="rotate-ccw"></i> Reestablecer Prompts</button>
    <button class="btn btn-primary" onclick="salvarPrompts()"><i data-lucide="save"></i> Guardar prompts</button>
  </div>

  <!-- HORARIOS -->
  <div id="horarios" class="panel">
    <label>Zona horaria</label>
    <select id="tz">
      <optgroup label="Perú"><option value="America/Lima">America/Lima — Perú</option></optgroup>
      <optgroup label="Ecuador"><option value="America/Guayaquil">America/Guayaquil — Ecuador</option></optgroup>
      <optgroup label="Colombia"><option value="America/Bogota">America/Bogota — Colombia</option></optgroup>
      <optgroup label="México">
        <option value="America/Mexico_City">America/Mexico_City — CDMX</option>
        <option value="America/Cancun">America/Cancun — Cancún</option>
        <option value="America/Tijuana">America/Tijuana — Tijuana</option>
      </optgroup>
      <optgroup label="Chile"><option value="America/Santiago">America/Santiago — Chile</option></optgroup>
      <optgroup label="Argentina"><option value="America/Argentina/Buenos_Aires">America/Argentina/Buenos_Aires</option></optgroup>
      <optgroup label="Brasil">
        <option value="America/Sao_Paulo">America/Sao_Paulo — Brasil</option>
        <option value="America/Manaus">America/Manaus — Manaos</option>
      </optgroup>
      <optgroup label="EE. UU.">
        <option value="America/New_York">America/New_York — ET</option>
        <option value="America/Chicago">America/Chicago — CT</option>
        <option value="America/Denver">America/Denver — MT</option>
        <option value="America/Los_Angeles">America/Los_Angeles — PT</option>
      </optgroup>
    </select>
    <p class="hint">Las horas de abajo se interpretan en esta zona.</p>
    <label>Invitación Daily (L–V)</label>
    <div class="tp" id="tp_h_daily">
      <button type="button" class="tp-trigger" onclick="toggleTP(event,'h_daily')">
        <i class="tp-clock" data-lucide="clock"></i><span class="tp-val" id="tpv_h_daily">--:--</span><i class="tp-caret" data-lucide="chevron-down"></i>
      </button>
      <div class="tp-pop"><div class="tp-col"></div><div class="tp-col"></div></div>
    </div>
    <label>Invitación Weekly (viernes)</label>
    <div class="tp" id="tp_h_weekly">
      <button type="button" class="tp-trigger" onclick="toggleTP(event,'h_weekly')">
        <i class="tp-clock" data-lucide="clock"></i><span class="tp-val" id="tpv_h_weekly">--:--</span><i class="tp-caret" data-lucide="chevron-down"></i>
      </button>
      <div class="tp-pop"><div class="tp-col"></div><div class="tp-col"></div></div>
    </div>
    <label>Cierre Daily (L–V)</label>
    <div class="tp" id="tp_h_closeDaily">
      <button type="button" class="tp-trigger" onclick="toggleTP(event,'h_closeDaily')">
        <i class="tp-clock" data-lucide="clock"></i><span class="tp-val" id="tpv_h_closeDaily">--:--</span><i class="tp-caret" data-lucide="chevron-down"></i>
      </button>
      <div class="tp-pop"><div class="tp-col"></div><div class="tp-col"></div></div>
    </div>
    <label>Cierre Weekly (viernes)</label>
    <div class="tp" id="tp_h_closeWeekly">
      <button type="button" class="tp-trigger" onclick="toggleTP(event,'h_closeWeekly')">
        <i class="tp-clock" data-lucide="clock"></i><span class="tp-val" id="tpv_h_closeWeekly">--:--</span><i class="tp-caret" data-lucide="chevron-down"></i>
      </button>
      <div class="tp-pop"><div class="tp-col"></div><div class="tp-col"></div></div>
    </div>
    <p class="hint">Los cambios los toma el dispatcher (cada 5 min); no reinstala nada.</p>
    <div class="divider"></div>
    <h3>Líder (recibe los consolidados)</h3>
    <label>Nombre</label><input id="l_name">
    <label>Correo</label><input id="l_email" type="email">
    <button class="btn btn-primary" onclick="salvarHorarios()"><i data-lucide="save"></i> Guardar horarios y líder</button>
  </div>

  <!-- EQUIPO -->
  <div id="equipo" class="panel">
    <div id="listaEquipo"></div>
    <button class="btn btn-ghost" onclick="addMiembro()"><i data-lucide="user-plus"></i> Agregar miembro</button>
    <button class="btn btn-primary" onclick="salvarEquipo()"><i data-lucide="save"></i> Guardar equipo</button>
  </div>

  <div id="toast"></div>

  <script>
    /* ---- Íconos Lucide inline (sin CDN) ---- */
    var ICONS = {
      'briefcase': '<rect width="20" height="14" x="2" y="6" rx="2"/><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
      'sparkles': '<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.962 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/>',
      'clock': '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
      'users': '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
      'save': '<path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/>',
      'user-plus': '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/>',
      'trash-2': '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>',
      'rotate-ccw': '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
      'chevron-down': '<path d="m6 9 6 6 6-6"/>',
      'check': '<path d="M20 6 9 17l-5-5"/>',
      'triangle-alert': '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
      'rotate': '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>'
    };
    function icons() {
      document.querySelectorAll('[data-lucide]').forEach(function (el) {
        var n = el.getAttribute('data-lucide');
        if (ICONS[n]) el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICONS[n] + '</svg>';
      });
    }

    var state = { equipo: [], promptDefaults: {} };
    var times = { h_daily: '', h_weekly: '', h_closeDaily: '', h_closeWeekly: '' };

    function g(id) { return document.getElementById(id); }
    function pad2(n) { n = String(n); return n.length < 2 ? '0' + n : n; }
    function escAttr(s) { return String(s == null ? '' : s).replace(/"/g, '&quot;'); }
    function escHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    // --- Navegación ---
    document.querySelectorAll('nav button').forEach(function (b) {
      b.onclick = function () {
        document.querySelectorAll('nav button').forEach(function (x) { x.classList.remove('active'); });
        document.querySelectorAll('.panel').forEach(function (p) { p.classList.remove('active'); });
        b.classList.add('active'); g(b.dataset.tab).classList.add('active');
      };
    });

    // --- google.script.run como Promise ---
    function run(method) {
      return function () {
        var args = Array.prototype.slice.call(arguments);
        return new Promise(function (resolve, reject) {
          google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method].apply(null, args);
        });
      };
    }
    function toast(msg, icon) {
      var t = g('toast');
      t.innerHTML = '<i data-lucide="' + (icon || 'check') + '"></i><span></span>';
      t.querySelector('span').textContent = msg; t.style.display = 'flex'; icons();
      clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, 2600);
    }

    // --- Carga inicial ---
    run('cargarConfig')().then(function (cfg) {
      state.equipo = cfg.equipo || [];
      state.promptDefaults = cfg.promptDefaults || {};
      var p = cfg.prompts || {}, d = state.promptDefaults;
      pv('p_soul', p.soul, d.soul); pv('p_user', p.user, d.user);
      pv('p_sd', p.taskSummaryDaily, d.taskSummaryDaily); pv('p_sw', p.taskSummaryWeekly, d.taskSummaryWeekly);
      pv('p_cd', p.taskConsolidatedDaily, d.taskConsolidatedDaily); pv('p_cw', p.taskConsolidatedWeekly, d.taskConsolidatedWeekly);
      var h = cfg.horarios || {};
      setTime('h_daily', h.invitesDaily); setTime('h_weekly', h.invitesWeekly);
      setTime('h_closeDaily', h.closeDaily); setTime('h_closeWeekly', h.closeWeekly);
      setTZ(cfg.timezone);
      var l = cfg.leader || {};
      g('l_name').value = l.name || ''; g('l_email').value = l.email || '';
      renderEquipo(); icons();
    }).catch(function (e) { toast('Error al cargar: ' + e.message, 'triangle-alert'); });

    function pv(id, value, placeholder) { var el = g(id); el.value = value || ''; el.placeholder = placeholder || ''; }
    function setTZ(tz) {
      var s = g('tz'), v = tz || 'America/Lima'; s.value = v;
      if (s.value !== v) { s.insertAdjacentHTML('afterbegin', '<option value="' + v + '">' + v + '</option>'); s.value = v; }
    }

    // --- Time picker (popover custom) ---
    function setTime(base, hhmm) {
      times[base] = hhmm || '';
      g('tpv_' + base).textContent = hhmm ? hhmm : '--:--';
    }
    function getTime(base) { return times[base] || ''; }
    function closeAllTP() { document.querySelectorAll('.tp-pop').forEach(function (p) { p.classList.remove('open'); }); }
    function toggleTP(e, base) {
      e.stopPropagation();
      var pop = document.querySelector('#tp_' + base + ' .tp-pop');
      var abrir = !pop.classList.contains('open');
      closeAllTP();
      if (abrir) { pop.classList.add('open'); buildTP(base); }
    }
    function buildTP(base) {
      var cur = (times[base] || '').split(':'), curH = cur[0] || '', curM = cur[1] || '';
      var cols = document.querySelectorAll('#tp_' + base + ' .tp-col');
      var hHtml = '', mHtml = '', v;
      for (var h = 0; h < 24; h++) { v = pad2(h); hHtml += '<div class="tp-item' + (v === curH ? ' sel' : '') + '" onclick="selectTP(\'' + base + '\',\'h\',\'' + v + '\')">' + v + '</div>'; }
      for (var m = 0; m < 60; m += 5) { v = pad2(m); mHtml += '<div class="tp-item' + (v === curM ? ' sel' : '') + '" onclick="selectTP(\'' + base + '\',\'m\',\'' + v + '\')">' + v + '</div>'; }
      cols[0].innerHTML = hHtml; cols[1].innerHTML = mHtml;
      var sh = cols[0].querySelector('.sel'); if (sh) cols[0].scrollTop = sh.offsetTop - 66;
      var sm = cols[1].querySelector('.sel'); if (sm) cols[1].scrollTop = sm.offsetTop - 66;
    }
    function selectTP(base, kind, val) {
      var cur = (times[base] || '').split(':'), H = cur[0] || '00', M = cur[1] || '00';
      if (kind === 'h') H = val; else M = val;
      setTime(base, H + ':' + M); buildTP(base);
    }
    document.addEventListener('click', function (e) { if (!e.target.closest('.tp')) closeAllTP(); });

    // --- Panel Prompts ---
    function reestablecerPrompts() {
      if (!confirm('¿Cargar los prompts por defecto en los campos? Reemplazará lo que tengas escrito (recuerda Guardar después).')) return;
      var d = state.promptDefaults || {};
      g('p_soul').value = d.soul || ''; g('p_user').value = d.user || '';
      g('p_sd').value = d.taskSummaryDaily || ''; g('p_sw').value = d.taskSummaryWeekly || '';
      g('p_cd').value = d.taskConsolidatedDaily || ''; g('p_cw').value = d.taskConsolidatedWeekly || '';
      toast('Prompts por defecto cargados — recuerda Guardar', 'rotate');
    }
    function salvarPrompts() {
      var prompts = {
        soul: g('p_soul').value, user: g('p_user').value,
        taskSummaryDaily: g('p_sd').value, taskSummaryWeekly: g('p_sw').value,
        taskConsolidatedDaily: g('p_cd').value, taskConsolidatedWeekly: g('p_cw').value
      };
      run('guardarPrompts')(prompts).then(function () { toast('Prompts guardados'); })
        .catch(function (e) { toast('Error: ' + e.message, 'triangle-alert'); });
    }

    // --- Panel Horarios ---
    function salvarHorarios() {
      var horarios = {
        invitesDaily: getTime('h_daily'), invitesWeekly: getTime('h_weekly'),
        closeDaily: getTime('h_closeDaily'), closeWeekly: getTime('h_closeWeekly'),
        timezone: g('tz').value
      };
      var leader = { name: g('l_name').value, email: g('l_email').value };
      Promise.all([run('guardarHorarios')(horarios), run('guardarLeader')(leader)])
        .then(function () { toast('Horarios y líder guardados'); })
        .catch(function (e) { toast('Error: ' + e.message, 'triangle-alert'); });
    }

    // --- Panel Equipo ---
    function renderEquipo() {
      var cont = g('listaEquipo'); cont.innerHTML = '';
      state.equipo.forEach(function (m, i) {
        var div = document.createElement('div'); div.className = 'card';
        div.innerHTML =
          '<div class="row"><input placeholder="Nombre" value="' + escAttr(m.nombre) + '" oninput="updM(' + i + ',\'nombre\',this.value)">' +
          '<button class="icon-btn" onclick="delMiembro(' + i + ')"><i data-lucide="trash-2"></i></button></div>' +
          '<input placeholder="Correo" value="' + escAttr(m.correo) + '" oninput="updM(' + i + ',\'correo\',this.value)">' +
          '<input placeholder="Rol" value="' + escAttr(m.rol) + '" oninput="updM(' + i + ',\'rol\',this.value)">';
        cont.appendChild(div);
      });
      icons();
    }
    function updM(i, campo, valor) { state.equipo[i][campo] = valor; }
    function addMiembro() { state.equipo.push({ nombre: '', correo: '', rol: '' }); renderEquipo(); }
    function delMiembro(i) { state.equipo.splice(i, 1); renderEquipo(); }
    function salvarEquipo() {
      run('guardarEquipo')(state.equipo).then(function (r) { toast('Equipo guardado (' + r.count + ')'); })
        .catch(function (e) { toast('Error: ' + e.message, 'triangle-alert'); });
    }

    icons();
  </script>
</body>
</html>
